name: Publish to PyPI

# Runs when a version tag such as v0.13.0 is pushed. The built sdist and wheel
# must pass lint and type checks, the regression suite, and an installed-wheel
# check before upload.
# PyPI trusts this workflow through trusted publishing, so no API token is
# stored anywhere.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import re, pathlib; print(re.search(r"VERSION = \"([^\"]+)\"", pathlib.Path("src/logplane/version.py").read_text()).group(1))')"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned checkers and runtime dependencies
        # mypy needs the runtime dependencies to know their types.
        run: python -m pip install -r requirements.txt -r requirements-lint.txt
      - name: Ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy

  validate:
    name: Validate ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', dependencies: minimum}
          - {os: ubuntu-latest, python: '3.13', dependencies: latest}
          - {os: macos-latest, python: '3.13', dependencies: latest}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Install development tools and runtime dependencies
        env:
          DEPENDENCY_SET: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCY_SET" = minimum ]; then
            python -m pip install -c ci/constraints-min.txt -r requirements-dev.txt
          else
            python -m pip install -r requirements-dev.txt
          fi
          python -m pip install --no-deps -e .
      - name: Regression suite on the tagged commit
        run: python -m pytest -q
      - name: Install and exercise the exact wheel that will be uploaded
        env:
          DEPENDENCY_SET: ${{ matrix.dependencies }}
        run: |
          if [ "$DEPENDENCY_SET" = minimum ]; then
            python scripts/check_release.py --wheel dist/*.whl --output .release-check --constraints ci/constraints-min.txt
          else
            python scripts/check_release.py --wheel dist/*.whl --output .release-check
          fi

  publish:
    name: Upload to PyPI
    # Only the artifact that passed every validation job is uploaded.
    needs: [build, quality, validate]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/logplane/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
